  #     al_tol_schedule:    [1500.0,  100.0, 100, 450]
  #     cht_gamma_schedule: [0.0125,  0.0,   100, 450]

  # T4 — T2 with pop=24.  Tests whether doubling μ (and therefore λ)
  # changes the dynamics: more parents → richer Pareto front candidates,
  # more offspring → more sentinel events per gen but also more
  # information per gen.  pop scaling probes the small-population
