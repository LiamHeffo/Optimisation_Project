# Experiment configurations for the X2 MO-CMA-ES driver optimisation.
#
# Each entry configures one call to main().  Fields:
#
#   sim_type     : constraint-handling strategy
#                    'ParentValue'      – infeasible offspring inherit parent's attribute value
#                    'ElitistCrossover' – HV-best parent donates the violating attribute
#                    'RandomCrossover'  – random parent donates the violating attribute
#                    'Penalty'          – infeasible individuals receive a fitness penalty
#                    'CovarianceCHT'    – Chocat 2015 / Arnold-Hansen 2012 covariance
#                                          shrinkage along violation directions.
#                                          Infeasible offspring are NOT repaired
#                                          and NOT evaluated by SPARK / PITOT3;
#                                          their constraint vectors feed an
#                                          eigendecompose-shrink-rescale update
#                                          of each parent's Cholesky factor.
#                                          Per-parent Adaptation-B Mahalanobis
#                                          pooling: each parent's C is updated
#                                          from every infeasible across the swarm,
#                                          weighted by closeness in that parent's
#                                          metric.  See _chtCovarianceUpdate.
#                    'CHT_AL'           – CovarianceCHT (above) PLUS Augmented
#                                          Lagrangian handling of delta_vs1.
#                                          Problem becomes 2-objective
#                                          (hold_time, impact_speed); delta_vs1
#                                          is a constraint adapted via pycma's
#                                          AugmentedLagrangian (algorithm 3,
#                                          Dufossé & Hansen 2020 χ setting).
#                                          MUST set p4_treatment: null and is
#                                          incompatible with the legacy plot
#                                          and CSV layouts (writes its own
#                                          al_diagnostics directory).
#
#   pop_size     : population size  (MU = LAMBDA = pop_size)
#
#   step_size    : initial CMA-ES step size (sigma), in normalised [1,2]^6 space
#
#   p4_treatment : how to enforce the upper p4 bound after mutation
#                    'hard_bounds_on_p4' – re-transform to stay within the physical p4 limit
#                    null                – no special treatment.  Mandatory for
#                                          'CovarianceCHT' and 'CHT_AL' since
#                                          the CHT replaces repair entirely.
#
#   al_tol       : (CHT_AL only) tolerance ε in m/s for the AL constraint
#                  g_AL(x) = delta_vs1(x) - ε ≤ 0.  Default 100 m/s
#                  (≈ 2% of the 4900 m/s shock-speed target).  Smaller values
#                  drive the AL toward a tighter delta_vs1 at the cost of
#                  longer convergence; larger values relax the constraint.

experiments:
  - sim_type: CHT_AL
    pop_size: 12
    step_size: 0.05
    p4_treatment: null
    al_tol: 100.0

