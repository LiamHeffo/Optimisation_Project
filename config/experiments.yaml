# Experiment configurations for the X2 MO-CMA-ES driver optimisation.
#
# Each entry configures one call to main().  Fields:
#
#   sim_type     : constraint-handling strategy
#                    'ParentValue'      – infeasible offspring inherit parent's attribute value
#                    'ElitistCrossover' – HV-best parent donates the violating attribute
#                    'RandomCrossover'  – random parent donates the violating attribute
#                    'Penalty'          – infeasible individuals receive a fitness penalty
#                    'CovarianceCHT'    – Chocat 2015 / Arnold-Hansen 2012 covariance
#                                          shrinkage along violation directions.
#                                          Infeasible offspring are NOT repaired
#                                          and NOT evaluated by SPARK / PITOT3;
#                                          their constraint vectors feed an
#                                          eigendecompose-shrink-rescale update
#                                          of each parent's Cholesky factor.
#                                          Per-parent Adaptation-B Mahalanobis
#                                          pooling: each parent's C is updated
#                                          from every infeasible across the swarm,
#                                          weighted by closeness in that parent's
#                                          metric.  See _chtCovarianceUpdate.
#                    'CHT_AL'           – CovarianceCHT (above) PLUS Augmented
#                                          Lagrangian handling of delta_vs1.
#                                          Problem becomes 2-objective
#                                          (hold_time, impact_speed); delta_vs1
#                                          is a constraint adapted via pycma's
#                                          AugmentedLagrangian (algorithm 3,
#                                          Dufossé & Hansen 2020 χ setting).
#                                          MUST set p4_treatment: null and is
#                                          incompatible with the legacy plot
#                                          and CSV layouts (writes its own
#                                          al_diagnostics directory).
#
#   pop_size     : population size  (MU = LAMBDA = pop_size)
#
#   step_size    : initial CMA-ES step size (sigma), in normalised [1,2]^6 space
#
#   p4_treatment : how to enforce the upper p4 bound after mutation
#                    'hard_bounds_on_p4' – re-transform to stay within the physical p4 limit
#                    null                – no special treatment.  Mandatory for
#                                          'CovarianceCHT' and 'CHT_AL' since
#                                          the CHT replaces repair entirely.
#
#   al_tol       : (CHT_AL only) tolerance ε in m/s for the AL constraint
#                  g_AL(x) = delta_vs1(x) - ε ≤ 0.  Default 100 m/s
#                  (≈ 2% of the 4900 m/s shock-speed target).  Smaller values
#                  drive the AL toward a tighter delta_vs1 at the cost of
#                  longer convergence; larger values relax the constraint.
#
#   cht_gamma    : (CovarianceCHT / CHT_AL) shrinkage strength applied to
#                  each parent's Cholesky factor along violation directions
#                  in _chtCovarianceUpdate.  Higher ⇒ more aggressive
#                  collapse along infeasible directions, faster feasibility
#                  recovery, but risk of over-shrinking and starving
#                  exploration.  Omit the field to use the strategy's
#                  dimension-dependent default 0.5 / (n+2)  (= 0.0625 at n=6).
#                  Reference points along the sweep axis at n=6:
#                    0.00417 = 0.0125/3   (1/3 of Arnold-Hansen 2012 default)
#                    0.0125  = 0.1 / (n+2) (Arnold-Hansen 2012 default)
#                    0.0375  = 0.0125·3   (3× the Arnold-Hansen default)
#                    0.0625  = 0.5 / (n+2) (current strategy default, 5×)
#
#   features     : (optional) dict of anti-degeneration toggles aimed at
#                  preventing σ-collapse in the CHT/AL pipeline.  Each
#                  feature is INDEPENDENT and defaults to off — designed so
#                  any single one can be enabled in isolation to measure
#                  its effect.  Omit the dict (or set keys to null/false)
#                  to reproduce baseline behaviour.
#
#                  Group A — weaken / relax the CHT
#                    cht_eigenvalue_floor: float (e.g. 0.5)
#                        cap per-call shrinkage at (factor·prior_axis).
#                        0.5 ⇒ no axis loses more than 50% per call.
#                    cht_isotropy_alpha: float in (0, 1] (e.g. 0.05)
#                        after CHT shrinkage, pull eigenvalues toward
#                        their mean by α.  Counteracts anisotropy lock-in
#                        across many CHT calls.
#                    cht_gamma_schedule: [start, end, n_gens]
#                                     or  [start, end, start_gen, end_gen]
#                        Schedule for cht_gamma.  3-element form is the
#                        legacy linear-from-gen-0 schedule.  4-element
#                        form holds start until start_gen, interpolates
#                        linearly to end over [start_gen, end_gen], then
#                        stays at end.  Use the 4-element form for
#                        delayed γ-decay (e.g. hold full strength during
#                        the early CHT-pull phase, then back off).
#                    cht_kappa_trigger: float (e.g. 5.0)
#                        when κ(C) exceeds this threshold, re-isotropise
#                        even with no infeasibles present.  Escape valve.
#
#                  Group B — keep AL engaged
#                    al_lam_floor_factor: float (e.g. 0.01)
#                        maintain λ ≥ factor·μ instead of clamping to 0.
#                        Persistent (mild) attraction toward the boundary.
#                    al_mu_decay: float in (0, 1) (e.g. 0.99)
#                        when λ is at its floor, multiply μ by this factor
#                        each gen.  Lets the AL "forget" the early peak.
#                    al_tol_schedule: [start_tol, end_tol, n_gens]
#                                  or  [start_tol, end_tol, start_gen, end_gen]
#                        tighten ε over time.  3-element form is the
#                        legacy linear-from-gen-0 schedule.  4-element
#                        form holds start_tol until start_gen, then
#                        interpolates to end_tol over [start_gen, end_gen],
#                        and stays at end_tol.  Use 4-element for
#                        delayed onset (e.g. let the AL bootstrap on a
#                        wide initial tol, then tighten only once the
#                        search has stabilised).
#                    al_proxy_front_only: bool (e.g. true)
#                        drive the per-gen AL multiplier/penalty update from
#                        the first non-dominated front (w.r.t. AL-augmented
#                        fitness) instead of all surviving parents.  The MO
#                        analogue of pricing "the current solution(s)"
#                        (FRONT-ALAMO, Cocchi/Lapucci/Mansueto 2021).
#                        Affects only the update, NOT the iqr bootstrap.
#                    al_proxy_g_quantile: float in [0, 1] (e.g. 0.9)
#                        aggregate g_al over the proxy set with this upper
#                        quantile instead of the mean.  FRONT-ALAMO uses the
#                        WORST violation; a high quantile is the robust
#                        surrogate for max (mean lets feasible members mask
#                        infeasible ones, stalling the penalty).
#
#                  Group C — redefine / re-treat infeasibility
#                    cht_resample_tol: float (e.g. 0.02)
#                        allow this much constraint violation during the
#                        CHT resample loop.  Reduces CHT-trigger pressure.
#                    box_reflective_repair: bool (true/false)
#                        reflect [1,2]-box violations back into the box at
#                        sampling time, bypassing the CHT for box bounds.
#                    psucc_exclude_resampled: bool (true/false)
#                        exclude CHT-resampled offspring from the donor
#                        parent's σ/psucc adaptation.  Decouples σ from
#                        CHT-induced "successes".
#                    psucc_sentinel_as_failure: bool (true/false)
#                        partial reversal of Fix-S3.  When True, PITOT3
#                        and SPARK sentinel offspring in the *not-chosen*
#                        branch contribute the standard psucc decay + σ
#                        shrinkage — they are treated as honest failures
#                        rather than skipped.  The chosen-branch Fix-S3
#                        (no "+" signal from sentinel successes) stays
#                        active unconditionally.  Reframes sentinels as
#                        information about region (in)feasibility rather
#                        than noise.  Default False (full Fix-S3).
#
#                  Group F — diversity-preserving fixes (new in run set 11+)
#                    sigma_floor_silent: float (e.g. 1.0e-3)
#                        clamp σ ≥ this value once both AL and CHT have
#                        been silent for ≥ 20 consecutive generations.
#                        Direct backstop against σ collapse in the
#                        post-disengagement window.
#                    selection: 'hv_contribution' | 'crowding'
#                        within-front ranking criterion.
#                        'hv_contribution' (default) is the legacy
#                        Voss 2009 knee-attractive selection.
#                        'crowding' uses NSGA-II crowding distance,
#                        which removes the knee-seeking bias and
#                        directly promotes objective-space diversity.

experiments:
  # ════════════════════════════════════════════════════════════════════════
  # ACTIVE: ArnoldCHT_AL seeded from the L1d init population.
  #   • sim_type ArnoldCHT_AL  — Arnold & Hansen 2012 covariance update
  #                              (per-parent v_j, Eq. 6/7) + Augmented
  #                              Lagrangian on delta_vs1 (2-objective
  #                              hold_time / impact problem).
  #   • HV indicator           — default selection (no `selection: crowding`).
  #   • al_tol_schedule        — the ε schedule [4900 → 100 over gens
  #                              100..250].
  #   • arnold_beta / arnold_cc omitted ⇒ paper defaults 0.1/(n+2), 1/(n+2).
  # Seed with:  python3 src/init_population_l1d.py --pop-size 24 ... \
  #                 --launch-cmaes
  # (the seed pop_size must match this block's pop_size — see --seed-npz).
  #
  # TWO IDENTICAL REPLICATES: the `&arnold` anchor defines the config once
  # and `*arnold` repeats it, so `python3 src/main.py --seed-npz <npz>`
  # (dispatcher mode) runs both back-to-back in fresh subprocesses — same
  # seed population + hyperparameters, differing only by CMA-ES RNG draws.
  # Delete the `*arnold` line to run a single simulation.
  # ════════════════════════════════════════════════════════════════════════
  - &arnold
    sim_type: ArnoldCHT_AL
    pop_size: 24
    step_size: 0.1
    p4_treatment: null
    al_tol: 4900
    features:
      psucc_sentinel_as_failure: true
      al_tol_schedule: [4900, 100.0, 100, 250]
      # B4 (FRONT-ALAMO-aligned proxy shaping) — uncomment to A/B against
      # the legacy mean-of-all-parents proxy.  Both default off (legacy).
      # al_proxy_front_only: true
      # al_proxy_g_quantile: 0.9
  - *arnold

  # ────────────────────────────────────────────────────────────────────────
  # Anti-degeneration feature sweep — each entry enables exactly ONE
  # feature against the same baseline (pop=12, step=0.05, cht_gamma=0.0125,
  # al_tol=100).  Any HV / σ / κ(C) / lam-trajectory difference vs the
  # baseline is attributable to the enabled feature.
  #
  # Comment out the entries you don't want to run.  Each is ~500
  # generations and the runs are dispatched as fresh subprocesses, so
  # the order doesn't matter and you can safely skip any subset.
  # ────────────────────────────────────────────────────────────────────────

  # ────────────────────────────────────────────────────────────────────────
  # Run set 12+ — psucc_sentinel_as_failure exploration (NGEN = 500).
  #
  # All five tests share the new psucc_sentinel_as_failure toggle:
  # SPARK/PITOT3 sentinels in the not-chosen branch contribute σ shrinkage
  # rather than being skipped (treating numerical-failure regions as real
  # information about local feasibility).  Chosen-branch Fix-S3 stays
  # active unconditionally — a sentinel that survives selection is still
  # not a real success.
  #
  # Tests 2-5 also exercise the new 4-element schedule form
  # [start, end, start_gen, end_gen] for delayed-onset schedules:
  # the AL ε holds wide for the first 100 gens (lets the population
  # settle into a feasible region without aggressive constraint
  # pressure), then tightens over gens 100-450 and is constant for
  # the final 50 gens.
  # ────────────────────────────────────────────────────────────────────────

  # T1 — baseline + psucc_sentinel_as_failure.
  # Establishes the new reference: how does the death-spiral look once
  # σ shrinks in response to sentinel failures?  Direct comparison against
  # the pre-toggle baseline (0028).
  # - sim_type: CHT_AL
  #   pop_size: 12
  #   step_size: 0.05
  #   p4_treatment: null
  #   al_tol: 100.0
  #   cht_gamma: 0.0125
  #   features:
  #     psucc_sentinel_as_failure: true

  # T2 — delayed ε tightening (1500 → 100 over gens 100-450), pop=12.
  # Wide initial tol lets the AL bootstrap on a population that is mostly
  # AL-feasible (delta_vs1 < 1500 m/s), avoiding the early μ over-ramp
  # observed in the baseline rerun.  Tightening starts at gen 100, when
  # the search distribution has had time to align with the real Pareto
  # front, and finishes at gen 450 — the last 50 gens run at ε = 100 to
  # let the population settle on the final constraint surface.
  # - sim_type: CHT_AL
  #   pop_size: 12
  #   step_size: 0.05
  #   p4_treatment: null
  #   al_tol: 1500.0                  # initial; schedule overrides per-gen
  #   cht_gamma: 0.0125
  #   features:
  #     psucc_sentinel_as_failure: true
  #     al_tol_schedule: [1500.0, 100.0, 100, 450]

  # T3 — T2 + γ-decay schedule [0.0125 → 0.0 over gens 100-450], pop=12.
  # CHT shrinkage at full strength during the early feasibility-finding
  # phase (gens 0-99), then linear decay alongside the ε tightening
  # (gens 100-449), then γ = 0 for the final 50 gens.  At γ = 0 the
  # CHT effectively stops carving the covariance — the search runs on
  # pure CMA-ES adaptation, freeing it from the κ inflation observed in
  # the rerun set (κ ≈ 15-18 in 0028 / 0030 was CHT-driven).
  # - sim_type: CHT_AL
  #   pop_size: 12
  #   step_size: 0.05
  #   p4_treatment: null
  #   al_tol: 1500.0
  #   cht_gamma: 0.0125
