# Experiment configurations for the X2 MO-CMA-ES driver optimisation.
#
# Each entry configures one call to main().  Fields:
#
#   sim_type     : constraint-handling strategy
#                    'ParentValue'      – infeasible offspring inherit parent's attribute value
#                    'ElitistCrossover' – HV-best parent donates the violating attribute
#                    'RandomCrossover'  – random parent donates the violating attribute
#                    'Penalty'          – infeasible individuals receive a fitness penalty
#                    'CovarianceCHT'    – Chocat 2015 / Arnold-Hansen 2012 covariance
#                                          shrinkage along violation directions.
#                                          Infeasible offspring are NOT repaired
#                                          and NOT evaluated by SPARK / PITOT3;
#                                          their constraint vectors feed an
#                                          eigendecompose-shrink-rescale update
#                                          of each parent's Cholesky factor.
#                                          Per-parent Adaptation-B Mahalanobis
#                                          pooling: each parent's C is updated
#                                          from every infeasible across the swarm,
#                                          weighted by closeness in that parent's
#                                          metric.  See _chtCovarianceUpdate.
#                    'CHT_AL'           – CovarianceCHT (above) PLUS Augmented
#                                          Lagrangian handling of delta_vs1.
#                                          Problem becomes 2-objective
#                                          (hold_time, impact_speed); delta_vs1
#                                          is a constraint adapted via pycma's
#                                          AugmentedLagrangian (algorithm 3,
#                                          Dufossé & Hansen 2020 χ setting).
#                                          MUST set p4_treatment: null and is
#                                          incompatible with the legacy plot
#                                          and CSV layouts (writes its own
#                                          al_diagnostics directory).
#                    'ArnoldCHT'        – Arnold & Hansen 2012 covariance update.
#                                          Per-parent constraint vectors v_{j,i}
#                                          are accumulated from the σ·A·z steps
#                                          of infeasible offspring (Eq. 6) and
#                                          drive a multi-rank subtractive update
#                                          of A_i (Eq. 7) at the moment of
#                                          infeasibility.  No resample loop —
#                                          per the paper, the infeasible
#                                          iteration is complete and the slot
#                                          contributes NO selection candidate
#                                          that generation.  Uses only the
#                                          binary indicator 1_{g_j>0}, not the
#                                          constraint magnitude (invariance).
#                                          MUST set p4_treatment: null.
#                                          Chocat-only feature flags
#                                          (cht_eigenvalue_floor, cht_isotropy_alpha,
#                                          cht_gamma_schedule, cht_kappa_trigger,
#                                          cht_resample_tol, box_reflective_repair,
#                                          psucc_exclude_resampled) are REJECTED
#                                          at strategy __init__ for this sim_type.
#                    'ArnoldCHT_AL'     – ArnoldCHT (above) PLUS Augmented
#                                          Lagrangian on delta_vs1, with the
#                                          same 2-objective fit / output
#                                          layout as CHT_AL.
#
#   pop_size     : population size  (MU = LAMBDA = pop_size)
#
#   step_size    : initial CMA-ES step size (sigma), in normalised [1,2]^6 space
#
#   p4_treatment : how to enforce the upper p4 bound after mutation
#                    'hard_bounds_on_p4' – re-transform to stay within the physical p4 limit
#                    null                – no special treatment.  Mandatory for
#                                          any CHT-active sim_type
#                                          (CovarianceCHT / CHT_AL /
#                                           ArnoldCHT / ArnoldCHT_AL) since
#                                          the CHT replaces repair entirely.
#
#   al_tol       : (CHT_AL / ArnoldCHT_AL only) tolerance ε in m/s for the AL constraint
#                  g_AL(x) = delta_vs1(x) - ε ≤ 0.  Default 100 m/s
#                  (≈ 2% of the 4900 m/s shock-speed target).  Smaller values
#                  drive the AL toward a tighter delta_vs1 at the cost of
#                  longer convergence; larger values relax the constraint.
#
#   cht_gamma    : (CovarianceCHT / CHT_AL) shrinkage strength applied to
#                  each parent's Cholesky factor along violation directions
#                  in _chtCovarianceUpdate.  Higher ⇒ more aggressive
#                  collapse along infeasible directions, faster feasibility
#                  recovery, but risk of over-shrinking and starving
#                  exploration.  Omit the field to use the strategy's
#                  dimension-dependent default 0.5 / (n+2)  (= 0.0625 at n=6).
#                  Reference points along the sweep axis at n=6:
#                    0.00417 = 0.0125/3   (1/3 of Arnold-Hansen 2012 default)
#                    0.0125  = 0.1 / (n+2) (Arnold-Hansen 2012 default)
#                    0.0375  = 0.0125·3   (3× the Arnold-Hansen default)
#                    0.0625  = 0.5 / (n+2) (current strategy default, 5×)
#
#   arnold_beta  : (ArnoldCHT / ArnoldCHT_AL only) shrinkage strength for the
#                  Eq. 7 subtractive update of A_i.  Omit to use the paper
#                  default 0.1 / (n+2) (= 0.0125 at n=6).
#
#   arnold_cc    : (ArnoldCHT / ArnoldCHT_AL only) low-pass filter constant
#                  for the v_j accumulator in Eq. 6.  Omit to use the paper
#                  default 1 / (n+2) (= 0.125 at n=6).  Distinct from the
#                  CMA-ES search-path c (which is 2/(n+2)) — same name in
#                  the paper, different role here.
#
#   features     : (optional) dict of anti-degeneration toggles aimed at
#                  preventing σ-collapse in the CHT/AL pipeline.  Each
#                  feature is INDEPENDENT and defaults to off — designed so
#                  any single one can be enabled in isolation to measure
#                  its effect.  Omit the dict (or set keys to null/false)
#                  to reproduce baseline behaviour.
#
#                  Group A — weaken / relax the CHT
#                    cht_eigenvalue_floor: float (e.g. 0.5)
#                        cap per-call shrinkage at (factor·prior_axis).
#                        0.5 ⇒ no axis loses more than 50% per call.
#                    cht_isotropy_alpha: float in (0, 1] (e.g. 0.05)
#                        after CHT shrinkage, pull eigenvalues toward
#                        their mean by α.  Counteracts anisotropy lock-in
#                        across many CHT calls.
#                    cht_gamma_schedule: [start, end, n_gens]
#                        linear interpolation of cht_gamma over n_gens.
#                        Aggressive early, gentle late.
#                    cht_kappa_trigger: float (e.g. 5.0)
#                        when κ(C) exceeds this threshold, re-isotropise
#                        even with no infeasibles present.  Escape valve.
#
#                  Group B — keep AL engaged
#                    al_lam_floor_factor: float (e.g. 0.01)
#                        maintain λ ≥ factor·μ instead of clamping to 0.
#                        Persistent (mild) attraction toward the boundary.
#                    al_mu_decay: float in (0, 1) (e.g. 0.99)
#                        when λ is at its floor, multiply μ by this factor
#                        each gen.  Lets the AL "forget" the early peak.
#                    al_tol_schedule: [start_tol, end_tol, n_gens]
#                        tighten ε over time.  Keeps the constraint active
#                        when the search would otherwise sit comfortably.
#
#                  Group C — redefine / re-treat infeasibility
#                    cht_resample_tol: float (e.g. 0.02)
#                        allow this much constraint violation during the
#                        CHT resample loop.  Reduces CHT-trigger pressure.
#                    box_reflective_repair: bool (true/false)
#                        reflect [1,2]-box violations back into the box at
#                        sampling time, bypassing the CHT for box bounds.
#                    psucc_exclude_resampled: bool (true/false)
#                        exclude CHT-resampled offspring from the donor
#                        parent's σ/psucc adaptation.  Decouples σ from
#                        CHT-induced "successes".
#
#                  Group G — restart strategies
#                    restart_on_sigma_collapse: dict
#                        M1 internal restart.  Required fields:
#                          sigma_threshold: float   (e.g. 1.0e-5)
#                              trigger when max(σ) < this for sustained_gens
#                              consecutive generations.
#                          sustained_gens: int      (e.g. 5)
#                          pop_increment: int       (e.g. 0 or 12)
#                              add this many fresh individuals on each
#                              restart.  0 ⇒ σ-only (warm) restart: existing
#                              parents keep their design vectors but their
#                              per-parent CMA state (σ, p_succ, p_c, A,
#                              invCholesky) is reset to defaults; population
#                              size is unchanged.  >0 ⇒ IPOP-style growth
#                              (Auger & Hansen 2005), with the population
#                              extended by that many fresh feasible draws.
#                          max_restarts: int        (e.g. 3)
#                              hard cap on restarts per run.
#                    restart_round_two: dict
#                        M2 seeded round-2 restart.  After NGEN gens round 2
#                        is always launched, seeded from the non-dominated
#                        external archive.  Required fields:
#                          pop_increment: int       (e.g. 12)
#                          pad_with_random: bool    (true)
#
#   n_gen        : number of generations (default 500 for back-compat).
#
#   lhs_seed     : (optional) int.  Seeds the numpy Generator that drives
#                  every Latin Hypercube call in this run — initial population,
#                  M1 restart fresh individuals, and M2 padding all share
#                  the same Generator, so two runs with the same lhs_seed
#                  and the same code produce identical LHS streams.  Omit
#                  (or set to null) to use fresh OS entropy on each call
#                  (matches the legacy uniform-sampling behaviour).
#

experiments:

  # ─────────────────────────────────────────────────────────────────
  # Revised schedule (Arnold integration phase):
  #   • 3 × Arnold baseline runs  (sim_type: ArnoldCHT_AL, NGEN=500)
  #   • 3 × M1 with NGEN bumped to 500
  #   • M2 (round-2 seeded restart) removed
  #   • 3 × M3 (crowding-distance) kept at NGEN=400
  # All AL-active runs share the baseline ε schedule
  # [2000, 100, 100, 250] and psucc_sentinel_as_failure=true.
  # 3 replicates per method for seed-variance averaging (CV~21.6%).
  # ─────────────────────────────────────────────────────────────────

  # Arnold — Arnold & Hansen 2012 covariance update with AL on delta_vs1.
  # No cht_gamma (Chocat-only field — would be ignored, but omitting
  # makes the intent clear).  arnold_beta / arnold_cc default to the
  # paper values (0.1/(n+2), 1/(n+2)) — see the YAML header.
  - &arnold
    sim_type: ArnoldCHT_AL
    pop_size: 24
    step_size: 0.1
    p4_treatment: null
    al_tol: 4900
    n_gen: 500
    features:
      psucc_sentinel_as_failure: true
      al_tol_schedule: [4900, 100.0, 100, 250]
  - *arnold
  - *arnold

  # M1 — σ-only (warm) restart.  NGEN=500.
  # Triggers when max(σ) < 5e-4 for ≥5 consecutive gens.  Resets every
  # parent's per-parent CMA state (σ → step_size, p_succ → ptarg,
  # p_c → 0, A and invCholesky → I) while keeping their design vectors.
  # Population size is unchanged (pop_increment: 0) — this isolates the
  # σ-reset effect from IPOP-style population growth.  Up to 3 restarts
  # allowed per run.
  # - &m1
  #   sim_type: CHT_AL
  #   pop_size: 24
  #   step_size: 0.1
  #   p4_treatment: null
  #   al_tol: 2000.0
  #   cht_gamma: 0.0125
  #   n_gen: 500
  #   features:
  #     psucc_sentinel_as_failure: true
  #     al_tol_schedule: [2000.0, 100.0, 100, 250]
  #     restart_on_sigma_collapse:
  #       sigma_threshold: 5.0e-4
  #       sustained_gens: 5
  #       pop_increment: 0
  #       max_restarts: 3
  # - *m1
  # - *m1

  # M3 — crowding-distance selection.  NGEN=400.
  # Replaces HV-contribution within-front ranking with NSGA-II crowding
  # distance, removing the knee-attractive bias that drives the σ spiral.
  - &m3
    sim_type: CHT_AL
    pop_size: 24
    step_size: 0.1
    p4_treatment: null
    al_tol: 2000.0
    cht_gamma: 0.0125
    n_gen: 400
    features:
      psucc_sentinel_as_failure: true
      al_tol_schedule: [2000.0, 100.0, 100, 250]
      selection: crowding
  - *m3
  - *m3

